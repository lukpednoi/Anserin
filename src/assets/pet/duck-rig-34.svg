    <path d="M 204.9 98.0 C 182.6 78.5 156.9 60.9 142.7 57.4 C 140.6 58.8 148.4 71.7 166.7 86.8 C 181.2 98.2 193.3 106.8 196.2 109.0 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 204.0 95.6 C 184.9 71.9 162.1 49.5 148.5 43.3 C 146.2 44.4 151.9 58.7 167.7 77.2 C 180.4 91.3 191.1 102.1 193.6 105.0 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 203.1 93.3 C 188.8 67.3 170.7 42.0 158.5 33.9 C 156.1 34.6 159.0 49.3 171.0 69.8 C 180.8 85.4 189.2 97.6 191.2 100.8 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 201.9 91.2 C 193.3 65.3 180.7 39.6 170.6 30.5 C 168.1 30.8 168.0 44.7 175.5 65.2 C 181.9 80.9 187.6 93.3 188.9 96.4 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 200.5 89.1 C 197.2 65.3 190.0 41.1 181.9 31.7 C 179.4 31.6 176.6 43.9 179.9 62.8 C 183.0 77.5 186.2 89.1 186.8 92.0 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 208.0 106.8 C 188.5 102.0 167.3 101.5 157.4 107.4 C 156.5 110.2 165.0 118.0 180.8 121.0 C 193.1 122.8 203.2 123.3 205.6 123.7 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 213.7 115.8 C 196.1 109.0 176.4 106.1 166.3 111.0 C 165.1 113.7 172.1 122.2 186.4 126.9 C 197.7 130.0 207.0 131.6 209.3 132.2 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 219.4 124.9 C 203.8 116.4 185.8 111.7 175.7 115.5 C 174.2 118.0 179.6 127.1 192.3 133.2 C 202.5 137.3 211.0 139.8 213.0 140.6 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 225.0 134.1 C 211.6 124.3 195.4 118.1 185.4 120.9 C 183.7 123.2 187.3 132.6 198.4 139.7 C 207.4 144.7 215.0 147.9 216.8 148.9 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 230.6 143.4 C 219.5 132.8 205.1 125.3 195.3 127.2 C 193.3 129.3 195.4 138.8 204.7 146.6 C 212.4 152.2 219.0 156.0 220.6 157.1 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 236.0 152.8 C 227.2 141.7 214.8 133.5 205.2 134.5 C 203.0 136.4 203.5 145.6 211.1 153.9 C 217.5 159.9 223.2 164.0 224.5 165.2 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
    <path d="M 236.0 170.0 C 225.2 170.7 193.4 115.7 192.7 88.8 C 208.1 96.4 226.9 97.7 237.2 121.1 C 258.7 152.8 244.6 166.3 236.0 170.0 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1.1"/>
    <path d="M 217.1 117.4 q 5 4 10 0 M 223.1 128.6 q 5 4 10 0 M 229.1 139.8 q 5 4 10 0 M 235.1 151.0 q 5 4 10 0" fill="none" stroke="pal:l_cdd1d7" stroke-width="1" opacity="0.8"/>
  </g>

  <g id="nearLeg">
    <path d="M 180 250 C 180 256 179 262 178 268" fill="none" stroke="url(#leg)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 176 266 C 186 266 198 270 206 276 C 198 281 188 280 180 279 C 172 280 162 278 156 274 C 160 269 168 266 176 266 Z" fill="#f08f2c"/>
    <path d="M 178 268 L 204 276 M 178 268 L 182 279 M 178 268 L 158 274" fill="none" stroke="#c96a1e" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
