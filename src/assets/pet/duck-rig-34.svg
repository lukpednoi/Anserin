  <g id="wingOpen">
    <path d="M 206.2 103.3 C 183.9 94.3 159.3 88.4 147.2 90.8 C 145.8 92.9 155.0 101.5 173.1 108.1 C 187.4 112.7 199.0 115.7 201.8 116.7 Z" fill="url(#wingOpen)" stroke="pal:l_bfc4cc" stroke-width="1"/>
